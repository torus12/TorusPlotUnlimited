# TorusPlot style preset. All sizes in points unless the key ends in _mm.
name: Torus Signature
order: 1
description: 'Modern, high-contrast and clean: bold palette, raw points on tinted
  bars, open top/right.'
width_mm: 89
height_mm: 70
font_family: Inter
font_size: 8
title_size: 9
label_size: 8
tick_size: 7
legend_size: 7
axis_linewidth: 0.8
line_width: 1.3
errorbar_linewidth: 0.9
cap_size: 2.5
point_size: 3.4
point_alpha: 0.9
point_edge_color: '#FFFFFF'
point_edge_width: 0.35
point_color_mode: dark
bar_width: 0.64
bar_alpha: 0.88
bar_edge_color: group
bar_edge_width: 0.8
bar_fill: true
spines:
- left
- bottom
tick_direction: out
tick_length: 3.0
grid: false
grid_color: '#E3E6EA'
background: '#FFFFFF'
text_color: '#16181D'
axis_color: '#16181D'
palette: Torus
colormap: viridis
bracket_linewidth: 0.8
annotation_size: 8
title_weight: bold
label_weight: normal

# TorusPlot style preset. All sizes in points unless the key ends in _mm.
name: Minimal
order: 6
description: 'Quiet and airy: light axes, no bar outlines, soft colours, subtle horizontal
  grid.'
width_mm: 89
height_mm: 70
font_family: Source Sans 3
font_size: 8.5
title_size: 9.5
label_size: 8.5
tick_size: 7.5
legend_size: 7.5
axis_linewidth: 0.5
line_width: 1.3
errorbar_linewidth: 0.8
cap_size: 0.0
point_size: 3.0
point_alpha: 0.85
point_edge_color: '#FFFFFF'
point_edge_width: 0.35
point_color_mode: dark
bar_width: 0.64
bar_alpha: 0.75
bar_edge_color: group
bar_edge_width: 0.0
bar_fill: true
spines:
- bottom
tick_direction: out
tick_length: 0.0
grid: true
grid_color: '#EEF0F2'
background: '#FFFFFF'
text_color: '#3A3F47'
axis_color: '#9AA1AC'
palette: Torus Soft
colormap: viridis
bracket_linewidth: 0.6
annotation_size: 8
title_weight: normal
label_weight: normal

# TorusPlot style preset. All sizes in points unless the key ends in _mm.
name: Journal 1.5-Column (120 mm)
order: 4
description: 'One-and-a-half-column figure: 120 mm wide, 7 pt text, colourblind-safe
  palette.'
width_mm: 120
height_mm: 80
font_family: Liberation Sans
font_size: 7
title_size: 8
label_size: 7
tick_size: 6
legend_size: 6
axis_linewidth: 0.6
line_width: 1.0
errorbar_linewidth: 0.7
cap_size: 2.0
point_size: 2.8
point_alpha: 0.9
point_edge_color: '#FFFFFF'
point_edge_width: 0.25
point_color_mode: dark
bar_width: 0.64
bar_alpha: 0.9
bar_edge_color: group
bar_edge_width: 0.6
bar_fill: true
spines:
- left
- bottom
tick_direction: out
tick_length: 2.5
grid: false
grid_color: '#E3E6EA'
background: '#FFFFFF'
text_color: '#000000'
axis_color: '#000000'
palette: Okabe-Ito
colormap: viridis
bracket_linewidth: 0.6
annotation_size: 7
title_weight: bold
label_weight: normal

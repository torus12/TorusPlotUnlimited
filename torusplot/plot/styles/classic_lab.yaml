# TorusPlot style preset. All sizes in points unless the key ends in _mm.
name: Classic Lab
order: 2
description: 'The traditional lab-meeting look: black axes, black/grey bars with black
  outlines, capped error bars.'
width_mm: 100
height_mm: 80
font_family: Liberation Sans
font_size: 9
title_size: 10
label_size: 9
tick_size: 8
legend_size: 8
axis_linewidth: 1.0
line_width: 1.2
errorbar_linewidth: 1.0
cap_size: 3.5
point_size: 3.6
point_alpha: 1.0
point_edge_color: '#000000'
point_edge_width: 0.6
point_color_mode: white
bar_width: 0.64
bar_alpha: 1.0
bar_edge_color: '#000000'
bar_edge_width: 1.0
bar_fill: true
spines:
- left
- bottom
tick_direction: out
tick_length: 4.0
grid: false
grid_color: '#E3E6EA'
background: '#FFFFFF'
text_color: '#000000'
axis_color: '#000000'
palette: Classic Lab
colormap: Greys
bracket_linewidth: 1.0
annotation_size: 9
title_weight: normal
label_weight: normal
